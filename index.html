<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>VEGA Fuel Systems | Product Library</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

:root{

    --red:#ed1c24;
    --red-dark:#bd1017;

    --black:#08090b;
    --dark:#101317;
    --dark2:#171b20;
    --line:#292f36;

    --white:#ffffff;
    --light:#f4f5f6;

    --text:#15181c;
    --muted:#77808a;

}


*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}


html{

    scroll-behavior:smooth;

}


body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#08090b;

    color:white;

    overflow-x:hidden;

}


button,
input,
select{

    font:inherit;

}


button{

    cursor:pointer;

}


.hidden{

    display:none !important;

}



/* =========================================================
   PAGE 1
   SHOWROOM IMAGE
========================================================= */

#homePage{

    width:100%;

    min-height:100vh;

    background:#08090b;

}


.showroom-container{

    position:relative;

    width:100%;

    max-width:1920px;

    margin:auto;

    background:#08090b;

}


.showroom-image{

    display:block;

    width:100%;

    height:auto;

    user-select:none;

    -webkit-user-drag:none;

}



/* =========================================================
   INVISIBLE PRODUCT AREAS
========================================================= */

.hotspot{

    position:absolute;

    top:17%;

    height:57%;

    cursor:pointer;

    border:
        2px solid transparent;

    transition:
        background .25s,
        border .25s,
        box-shadow .25s;

    z-index:10;

}


.hotspot:hover{

    background:
        rgba(237,28,36,.08);

    border:
        2px solid
        rgba(237,28,36,.75);

    box-shadow:

        inset
        0 0 30px
        rgba(237,28,36,.15),

        0 0 22px
        rgba(237,28,36,.25);

}


/* VIEW PRODUCTS BUTTON */

.hotspot::after{

    content:"VIEW PRODUCTS  →";

    position:absolute;

    left:50%;

    bottom:20px;

    transform:
        translateX(-50%)
        translateY(8px);

    white-space:nowrap;

    padding:
        10px
        15px;

    background:var(--red);

    color:white;

    border-radius:4px;

    font-size:11px;

    font-weight:700;

    letter-spacing:.8px;

    opacity:0;

    transition:.25s;

}


.hotspot:hover::after{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);

}



/* =========================================================
   HOTSPOT LOCATIONS
========================================================= */

.tanks{

    left:9.2%;
    width:15%;

}


.pumps{

    left:25.1%;
    width:14%;

}


.filters{

    left:40.2%;
    width:13.4%;

}


.valves{

    left:54.5%;
    width:12.6%;

}


.monitoring{

    left:67.8%;
    width:13.6%;

}


.controls{

    left:82%;
    width:13.8%;

}



/* =========================================================
   PAGE 2
   PRODUCT CATALOG
========================================================= */

#catalogPage{

    min-height:100vh;

    background:#f3f4f5;

    color:var(--text);

}



/* =========================================================
   CATALOG HEADER
========================================================= */

.catalog-header{

    height:76px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0
        4%;

    background:#090b0e;

    color:white;

    border-bottom:
        1px solid #242a30;

    position:sticky;

    top:0;

    z-index:500;

}



/* LOGO */

.catalog-logo{

    display:flex;

    align-items:center;

    gap:14px;

    cursor:pointer;

}


.logo-mark{

    width:42px;

    height:37px;

    position:relative;

}


.logo-mark::before,
.logo-mark::after{

    content:"";

    position:absolute;

    top:0;

    width:22px;

    height:37px;

    background:var(--red);

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

}


.logo-mark::before{

    left:0;

}


.logo-mark::after{

    right:0;

}


.catalog-logo-text strong{

    display:block;

    font-size:23px;

    letter-spacing:4px;

    line-height:1;

}


.catalog-logo-text span{

    display:block;

    margin-top:5px;

    font-size:9px;

    letter-spacing:3px;

    color:#949ca5;

}



/* HEADER SEARCH */

.header-search{

    width:
        min(
            470px,
            38vw
        );

    height:42px;

    border:
        1px solid #343b43;

    background:#12161a;

    color:white;

    border-radius:7px;

    padding:
        0
        15px;

    outline:none;

}


.header-search:focus{

    border-color:
        #7b858f;

}



/* BACK BUTTON */

.back-showroom{

    border:
        1px solid #464e57;

    background:transparent;

    color:white;

    padding:
        11px
        17px;

    border-radius:6px;

    font-weight:bold;

}


.back-showroom:hover{

    border-color:white;

}



/* =========================================================
   CATALOG TITLE
========================================================= */

.catalog-title-bar{

    background:

        linear-gradient(
            110deg,
            #0d1014,
            #12161a 65%,
            #251015
        );

    color:white;

    padding:
        38px
        5%;

    display:flex;

    justify-content:space-between;

    align-items:end;

    gap:30px;

}


.catalog-small{

    color:#8f99a4;

    font-size:10px;

    letter-spacing:4px;

}


.catalog-title-bar h1{

    margin-top:7px;

    font-size:
        clamp(
            30px,
            4vw,
            48px
        );

    text-transform:uppercase;

}


.catalog-title-bar h1 span{

    color:var(--red);

}


.catalog-counter{

    text-align:right;

    color:#a1a9b1;

    font-size:12px;

}


.catalog-counter strong{

    display:block;

    color:white;

    font-size:25px;

}



/* =========================================================
   MAIN CATALOG
========================================================= */

.catalog-main{

    max-width:1550px;

    margin:auto;

    padding:
        32px
        4%
        80px;

}



/* =========================================================
   CATEGORY BUTTONS
========================================================= */

.category-tabs{

    display:grid;

    grid-template-columns:
        repeat(7,1fr);

    gap:8px;

    margin-bottom:17px;

}


.category-tab{

    min-height:70px;

    border:
        1px solid #d7dade;

    background:white;

    border-radius:7px;

    color:#282d31;

    font-weight:bold;

    font-size:12px;

    transition:.2s;

}


.category-tab:hover{

    border-color:
        var(--red);

    color:var(--red);

}


.category-tab.active{

    background:var(--red);

    color:white;

    border-color:var(--red);

}



/* =========================================================
   FILTERS
========================================================= */

.filters{

    display:grid;

    grid-template-columns:
        2fr
        1fr
        1fr;

    gap:10px;

    padding:15px;

    background:white;

    border:
        1px solid #dbdee1;

    border-radius:8px;

    margin-bottom:24px;

}


.filters input,
.filters select{

    width:100%;

    height:45px;

    border:
        1px solid #d6d9dc;

    border-radius:5px;

    background:white;

    padding:
        0
        12px;

    outline:none;

}


.filters input:focus,
.filters select:focus{

    border-color:
        var(--red);

}



/* =========================================================
   PRODUCT GRID
========================================================= */

.product-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:17px;

}



/* =========================================================
   PRODUCT CARD
========================================================= */

.product-card{

    background:white;

    border:
        1px solid #dcdee1;

    border-radius:8px;

    overflow:hidden;

    transition:.25s;

    cursor:pointer;

}


.product-card:hover{

    transform:
        translateY(-5px);

    box-shadow:
        0 16px 35px
        rgba(0,0,0,.12);

    border-color:#bfc4c8;

}



/* PRODUCT IMAGE AREA */

.product-image{

    position:relative;

    height:230px;

    background:

        radial-gradient(
            circle at center,
            white 0,
            #f0f1f2 55%,
            #dddddd 100%
        );

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

}


.product-category{

    position:absolute;

    top:12px;

    left:12px;

    background:#111519;

    color:white;

    padding:
        6px
        8px;

    font-size:9px;

    border-radius:3px;

    text-transform:uppercase;

}


.product-brand{

    position:absolute;

    top:13px;

    right:12px;

    color:var(--red);

    font-weight:900;

    font-size:12px;

}



/* =========================================================
   CSS PRODUCT DRAWINGS
========================================================= */

.visual{

    transform:
        scale(1.2);

}



/* TANK */

.visual-tank{

    width:135px;

    height:70px;

    border-radius:36px;

    background:

        linear-gradient(
            90deg,
            #70787e,
            #cfd4d7 32%,
            #f5f6f6 53%,
            #868e94
        );

    border:
        2px solid #6a7075;

    position:relative;

    box-shadow:
        0 18px 18px
        rgba(0,0,0,.2);

}


.visual-tank::before,
.visual-tank::after{

    content:"";

    position:absolute;

    top:8px;

    width:30px;

    height:50px;

    border-radius:50%;

    border:
        2px solid #686e73;

    background:#b5bbc0;

}


.visual-tank::before{

    left:-12px;

}


.visual-tank::after{

    right:-12px;

}



/* PUMP */

.visual-pump{

    width:130px;

    height:60px;

    border-radius:8px;

    background:

        linear-gradient(
            90deg,
            #101214,
            #474b4e,
            #111315
        );

    position:relative;

    box-shadow:
        0 18px 18px
        rgba(0,0,0,.25);

}


.visual-pump::before{

    content:"";

    position:absolute;

    left:-35px;

    top:-4px;

    width:65px;

    height:65px;

    border-radius:50%;

    background:#272b2e;

    border:
        9px solid
        #08090a;

}


.visual-pump::after{

    content:"";

    position:absolute;

    right:-19px;

    top:13px;

    width:25px;

    height:35px;

    border-radius:4px;

    background:var(--red);

}



/* FILTER */

.visual-filter{

    display:flex;

    gap:16px;

}


.visual-filter span{

    display:block;

    width:47px;

    height:105px;

    border-radius:
        7px
        7px
        15px
        15px;

    background:

        linear-gradient(
            90deg,
            #24282b,
            #f2f2f2,
            #868b8f
        );

    border:
        2px solid #34383b;

    position:relative;

}


.visual-filter span::before{

    content:"";

    position:absolute;

    top:-11px;

    left:-7px;

    width:58px;

    height:16px;

    background:#222628;

    border-radius:4px;

}



/* VALVE */

.visual-valve{

    width:100px;

    height:54px;

    background:

        linear-gradient(
            90deg,
            #91611b,
            #d6a347,
            #845816
        );

    border-radius:14px;

    position:relative;

    box-shadow:
        0 18px 18px
        rgba(0,0,0,.2);

}


.visual-valve::before{

    content:"";

    position:absolute;

    width:88px;

    height:9px;

    left:46px;

    top:-35px;

    border-radius:5px;

    background:var(--red);

}


.visual-valve::after{

    content:"";

    position:absolute;

    width:13px;

    height:32px;

    left:48px;

    top:-28px;

    background:#3a3e41;

}



/* MONITOR */

.visual-monitor{

    width:105px;

    height:100px;

    padding:13px;

    border-radius:10px;

    background:#202428;

    border:
        5px solid #101214;

    box-shadow:
        0 18px 18px
        rgba(0,0,0,.22);

}


.monitor-screen{

    display:flex;

    align-items:center;

    justify-content:center;

    height:46px;

    border-radius:4px;

    background:#07150d;

    color:white;

    font-size:23px;

    font-weight:bold;

}


.monitor-dots{

    display:flex;

    gap:8px;

    margin-top:11px;

}


.monitor-dots i{

    width:8px;

    height:8px;

    border-radius:50%;

    background:#3ac76b;

}


.monitor-dots i:nth-child(2){

    background:#f4bf30;

}


.monitor-dots i:nth-child(3){

    background:var(--red);

}



/* CONTROL PANEL */

.visual-control{

    width:118px;

    height:135px;

    padding:15px;

    background:

        linear-gradient(
            90deg,
            #646a70,
            #aeb3b7,
            #666c70
        );

    border:
        2px solid #555b60;

    border-radius:5px;

    box-shadow:
        0 18px 18px
        rgba(0,0,0,.22);

}


.panel-screen{

    height:43px;

    background:#15191d;

    border-radius:3px;

}


.panel-lights{

    margin-top:17px;

    display:flex;

    justify-content:center;

    gap:12px;

}


.panel-lights i{

    width:9px;

    height:9px;

    border-radius:50%;

    background:#45bf70;

}


.panel-lights i:nth-child(2){

    background:#f3bf30;

}


.panel-lights i:nth-child(3){

    background:var(--red);

}



/* =========================================================
   PRODUCT CARD CONTENT
========================================================= */

.product-content{

    padding:18px;

}


.brand-name{

    color:var(--red);

    font-weight:bold;

    font-size:10px;

    text-transform:uppercase;

}


.product-content h3{

    margin-top:5px;

    font-size:18px;

    line-height:1.2;

}


.model{

    color:#818991;

    font-size:11px;

    margin-top:4px;

}


.description{

    color:#616970;

    font-size:12px;

    line-height:1.55;

    margin-top:11px;

    min-height:57px;

}



/* SPECIFICATIONS */

.quick-specs{

    border-top:
        1px solid #ebedef;

    margin-top:13px;

    padding-top:12px;

}


.quick-spec{

    display:flex;

    justify-content:space-between;

    gap:10px;

    padding:
        4px
        0;

    font-size:10px;

}


.quick-spec span{

    color:#8a9299;

}


.quick-spec strong{

    text-align:right;

}



/* PRICE AREA */

.card-footer{

    margin-top:14px;

    border-top:
        1px solid #ebedef;

    padding-top:14px;

    display:flex;

    justify-content:space-between;

    align-items:end;

    gap:10px;

}


.price small{

    display:block;

    color:#92999f;

    font-size:8px;

}


.price strong{

    display:block;

    color:var(--red);

    margin-top:3px;

    font-size:19px;

}


.details-button{

    border:0;

    background:#14181c;

    color:white;

    padding:
        9px
        12px;

    border-radius:4px;

    font-size:10px;

    font-weight:bold;

}



/* =========================================================
   PRODUCT MODAL
========================================================= */

#productModal{

    position:fixed;

    inset:0;

    z-index:3000;

    background:
        rgba(0,0,0,.78);

    backdrop-filter:
        blur(8px);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:25px;

}


.modal-box{

    position:relative;

    width:
        min(
            1050px,
            96vw
        );

    max-height:92vh;

    overflow:auto;

    display:grid;

    grid-template-columns:
        .9fr
        1.1fr;

    background:white;

    color:#171a1d;

    border-radius:10px;

    box-shadow:
        0 40px 100px
        rgba(0,0,0,.5);

}


.modal-close{

    position:absolute;

    top:15px;

    right:15px;

    width:38px;

    height:38px;

    border:0;

    border-radius:50%;

    background:#111519;

    color:white;

    font-size:20px;

    z-index:20;

}



/* MODAL VISUAL */

.modal-visual{

    min-height:570px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:

        radial-gradient(
            circle,
            white,
            #e3e5e6
        );

}



/* MODAL INFORMATION */

.modal-info{

    padding:
        50px
        42px;

}


.modal-category{

    color:var(--red);

    text-transform:uppercase;

    letter-spacing:2px;

    font-size:10px;

    font-weight:bold;

}


.modal-info h2{

    margin-top:7px;

    font-size:34px;

}


.modal-model{

    margin-top:5px;

    color:#798189;

    font-size:13px;

}


.modal-description{

    margin-top:20px;

    font-size:13px;

    color:#5e666e;

    line-height:1.7;

}



/* DETAILS TABLE */

.details-table{

    border:
        1px solid #e0e3e5;

    margin-top:23px;

    border-radius:5px;

    overflow:hidden;

}


.detail-row{

    display:grid;

    grid-template-columns:
        .8fr
        1.2fr;

    border-bottom:
        1px solid #e4e6e8;

    font-size:11px;

}


.detail-row:last-child{

    border-bottom:0;

}


.detail-row span{

    padding:11px;

    background:#f5f6f7;

    color:#767e85;

}


.detail-row strong{

    padding:11px;

}



/* PRICE */

.modal-price{

    margin-top:23px;

}


.modal-price small{

    color:#858d94;

    font-size:9px;

}


.modal-price strong{

    display:block;

    color:var(--red);

    margin-top:3px;

    font-size:29px;

}



/* ACTION BUTTONS */

.modal-actions{

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:10px;

    margin-top:22px;

}


.datasheet-button{

    height:47px;

    border:0;

    border-radius:5px;

    background:var(--red);

    color:white;

    font-weight:bold;

}


.quote-button{

    height:47px;

    border:0;

    border-radius:5px;

    background:#15191d;

    color:white;

    font-weight:bold;

}



/* =========================================================
   EMPTY
========================================================= */

.empty{

    grid-column:
        1 / -1;

    background:white;

    border:
        1px solid #ddd;

    text-align:center;

    padding:70px;

    color:#777;

}



/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1200px){

    .product-grid{

        grid-template-columns:
            repeat(3,1fr);

    }

    .category-tabs{

        grid-template-columns:
            repeat(4,1fr);

    }

}


@media(max-width:900px){

    .header-search{

        display:none;

    }

    .product-grid{

        grid-template-columns:
            repeat(2,1fr);

    }

    .filters{

        grid-template-columns:
            1fr
            1fr;

    }

    .modal-box{

        grid-template-columns:1fr;

    }

    .modal-visual{

        min-height:320px;

    }

}


@media(max-width:600px){

    .showroom-container{

        overflow-x:auto;

    }


    .showroom-image{

        width:1100px;

        max-width:none;

    }


    .catalog-header{

        padding:
            0
            15px;

    }


    .catalog-logo-text span{

        display:none;

    }


    .back-showroom{

        font-size:10px;

    }


    .catalog-title-bar{

        display:block;

        padding:
            27px
            18px;

    }


    .catalog-counter{

        margin-top:17px;

        text-align:left;

    }


    .catalog-main{

        padding:
            20px
            14px
            60px;

    }


    .category-tabs{

        grid-template-columns:
            1fr
            1fr;

    }


    .filters{

        grid-template-columns:1fr;

    }


    .product-grid{

        grid-template-columns:1fr;

    }


    .modal-info{

        padding:
            38px
            22px;

    }


    .modal-actions{

        grid-template-columns:1fr;

    }

}

</style>

</head>


<body>



<!-- =========================================================
     HOME PAGE
========================================================= -->

<section id="homePage">


    <div class="showroom-container">


        <img
            src="showroom.png"
            alt="VEGA Fuel Systems Product Showroom"
            class="showroom-image"
        >



        <!-- FUEL TANKS -->

        <div
            class="hotspot tanks"
            title="Fuel Tanks"
            onclick="openCatalog('tanks')"
        ></div>



        <!-- PUMPS -->

        <div
            class="hotspot pumps"
            title="Transfer Pumps"
            onclick="openCatalog('pumps')"
        ></div>



        <!-- FILTERS -->

        <div
            class="hotspot filters"
            title="Filtration"
            onclick="openCatalog('filters')"
        ></div>



        <!-- VALVES -->

        <div
            class="hotspot valves"
            title="Valves & Accessories"
            onclick="openCatalog('valves')"
        ></div>



        <!-- MONITORING -->

        <div
            class="hotspot monitoring"
            title="Monitoring"
            onclick="openCatalog('monitoring')"
        ></div>



        <!-- CONTROL PANELS -->

        <div
            class="hotspot controls"
            title="Control Panels"
            onclick="openCatalog('controls')"
        ></div>


    </div>


</section>



<!-- =========================================================
     PRODUCT CATALOG PAGE
========================================================= -->

<section
    id="catalogPage"
    class="hidden"
>


    <!-- HEADER -->

    <header class="catalog-header">


        <div
            class="catalog-logo"
            onclick="goHome()"
        >


            <div class="logo-mark"></div>


            <div class="catalog-logo-text">

                <strong>
                    VEGA
                </strong>

                <span>
                    FUEL SYSTEMS
                </span>

/* =========================================================
   VARIABLES
========================================================= */

let selectedCategory = "all";

let activeProduct = null;



/* =========================================================
   GO HOME
========================================================= */

function goHome(){


    document
    .getElementById(
        "catalogPage"
    )
    .classList
    .add(
        "hidden"
    );


    document
    .getElementById(
        "homePage"
    )
    .classList
    .remove(
        "hidden"
    );


    window.scrollTo(
        0,
        0
    );

}



/* =========================================================
   OPEN CATALOG
========================================================= */

function openCatalog(category){


    selectedCategory =
        category || "all";


    document
    .getElementById(
        "homePage"
    )
    .classList
    .add(
        "hidden"
    );


    document
    .getElementById(
        "catalogPage"
    )
    .classList
    .remove(
        "hidden"
    );


    updateCategoryTabs();


    renderProducts();


    window.scrollTo(
        0,
        0
    );

}



/* =========================================================
   SET CATEGORY
========================================================= */

function setCategory(
    category,
    button
){


    selectedCategory =
        category;


    document
    .querySelectorAll(
        ".category-tab"
    )
    .forEach(
        btn =>
        btn.classList.remove(
            "active"
        )
    );


    button
    .classList
    .add(
        "active"
    );


    renderProducts();

}



/* =========================================================
   UPDATE CATEGORY TABS
========================================================= */

function updateCategoryTabs(){


    document
    .querySelectorAll(
        ".category-tab"
    )
    .forEach(
        button=>{


            if(
                button.dataset.category
                ===
                selectedCategory
            ){

                button
                .classList
                .add(
                    "active"
                );

            }

            else{

                button
                .classList
                .remove(
                    "active"
                );

            }

        }
    );

}



/* =========================================================
   CREATE PRODUCT VISUAL
========================================================= */

function productVisual(type){


    if(
        type === "tank"
    ){

        return `

        <div class="visual visual-tank"></div>

        `;

    }


    if(
        type === "pump"
    ){

        return `

        <div class="visual visual-pump"></div>

        `;

    }


    if(
        type === "filter"
    ){

        return `

        <div class="visual visual-filter">

            <span></span>

            <span></span>

        </div>

        `;

    }


    if(
        type === "valve"
    ){

        return `

        <div class="visual visual-valve"></div>

        `;

    }


    if(
        type === "monitor"
    ){

        return `

        <div class="visual visual-monitor">

            <div class="monitor-screen">
                78%
            </div>

            <div class="monitor-dots">

                <i></i>

                <i></i>

                <i></i>

            </div>

        </div>

        `;

    }


    if(
        type === "control"
    ){

        return `

        <div class="visual visual-control">

            <div class="panel-screen"></div>

            <div class="panel-lights">

                <i></i>

                <i></i>

                <i></i>

            </div>

        </div>

        `;

    }


    return "";

}



/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(){


    const grid =
        document
        .getElementById(
            "productGrid"
        );


    const searchText =
        document
        .getElementById(
            "catalogSearch"
        )
        .value
        .trim()
        .toLowerCase();


    const brand =
        document
        .getElementById(
            "brandFilter"
        )
        .value;


    const sort =
        document
        .getElementById(
            "sortFilter"
        )
        .value;



    let filtered =
        products.filter(
            product=>{


                const categoryMatch =

                    selectedCategory
                    ===
                    "all"

                    ||

                    product.category
                    ===
                    selectedCategory;



                const brandMatch =

                    brand
                    ===
                    "all"

                    ||

                    product.brand
                    ===
                    brand;



                const searchData =

                    (

                        product.name
                        + " "
                        + product.brand
                        + " "
                        + product.model
                        + " "
                        + product.description
                        + " "
                        + product.categoryName

                    )
                    .toLowerCase();



                const searchMatch =

                    searchText
                    ===
                    ""

                    ||

                    searchData.includes(
                        searchText
                    );



                return

                    categoryMatch
                    &&
                    brandMatch
                    &&
                    searchMatch;

            }
        );



    if(
        sort === "name"
    ){

        filtered.sort(
            (a,b)=>
            a.name.localeCompare(
                b.name
            )
        );

    }



    if(
        sort === "priceLow"
    ){

        filtered.sort(
            (a,b)=>
            a.price-b.price
        );

    }



    if(
        sort === "priceHigh"
    ){

        filtered.sort(
            (a,b)=>
            b.price-a.price
        );

    }



    document
    .getElementById(
        "productCount"
    )
    .textContent =
        filtered.length;



    if(
        filtered.length
        ===
        0
    ){

        grid.innerHTML = `

        <div class="empty">

            No products found.

        </div>

        `;

        return;

    }



    grid.innerHTML =

        filtered
        .map(
            product=>{


                const quickSpecs =

                    Object.entries(
                        product.specs
                    )
                    .slice(
                        0,
                        3
                    );


                return `


                <article
                    class="product-card"
                    onclick="openProduct(${product.id})"
                >


                    <div class="product-image">


                        <div class="product-category">

                            ${product.categoryName}

                        </div>


                        <div class="product-brand">

                            ${product.brand}

                        </div>


                        ${productVisual(product.visual)}


                    </div>



                    <div class="product-content">


                        <div class="brand-name">

                            ${product.brand}

                        </div>


                        <h3>

                            ${product.name}

                        </h3>


                        <div class="model">

                            Model:
                            ${product.model}

                        </div>


                        <p class="description">

                            ${product.description}

                        </p>



                        <div class="quick-specs">


                            ${

                                quickSpecs
                                .map(
                                    ([key,value])=>`

                                    <div class="quick-spec">

                                        <span>
                                            ${key}
                                        </span>

                                        <strong>
                                            ${value}
                                        </strong>

                                    </div>

                                    `
                                )
                                .join("")

                            }


                        </div>



                        <div class="card-footer">


                            <div class="price">

                                <small>
                                    SELLING PRICE
                                </small>

                                <strong>

                                    ${product.price.toLocaleString()}
                                    SAR

                                </strong>

                            </div>


                            <button class="details-button">

                                DETAILS →

                            </button>


                        </div>


                    </div>


                </article>


                `;

            }
        )
        .join("");

}



/* =========================================================
   OPEN PRODUCT DETAILS
========================================================= */

function openProduct(id){


    activeProduct =
        products.find(
            product =>
            product.id
            ===
            id
        );


    if(
        !activeProduct
    ){

        return;

    }



    document
    .getElementById(
        "modalVisual"
    )
    .innerHTML =
        productVisual(
            activeProduct.visual
        );



    document
    .getElementById(
        "modalCategory"
    )
    .textContent =
        activeProduct.categoryName;



    document
    .getElementById(
        "modalTitle"
    )
    .textContent =
        activeProduct.name;



    document
    .getElementById(
        "modalModel"
    )
    .textContent =

        activeProduct.brand
        +
        " · "
        +
        activeProduct.model;



    document
    .getElementById(
        "modalDescription"
    )
    .textContent =
        activeProduct.description;



    document
    .getElementById(
        "modalPrice"
    )
    .textContent =

        activeProduct
        .price
        .toLocaleString()

        +

        " SAR";



    document
    .getElementById(
        "detailsTable"
    )
    .innerHTML =

        Object.entries(
            activeProduct.specs
        )
        .map(
            ([key,value])=>`

            <div class="detail-row">

                <span>

                    ${key}

                </span>

                <strong>

                    ${value}

                </strong>

            </div>

            `
        )
        .join("");



    document
    .getElementById(
        "productModal"
    )
    .classList
    .remove(
        "hidden"
    );

}



/* =========================================================
   CLOSE PRODUCT
========================================================= */

function closeProduct(){


    document
    .getElementById(
        "productModal"
    )
    .classList
    .add(
        "hidden"
    );

}



/* =========================================================
   DATASHEET
========================================================= */

function openDatasheet(){


    if(
        activeProduct
        &&
        activeProduct.datasheet
    ){

        window.open(
            activeProduct.datasheet,
            "_blank"
        );

    }

    else{

        alert(
            "Datasheet will be added for this product."
        );

    }

}



/* =========================================================
   QUOTATION
========================================================= */

function requestQuotation(){

    alert(
        "Quotation function can be connected later."
    );

}



/* =========================================================
   SEARCH / FILTER EVENTS
========================================================= */

document
.getElementById(
    "catalogSearch"
)
.addEventListener(
    "input",
    renderProducts
);



document
.getElementById(
    "brandFilter"
)
.addEventListener(
    "change",
    renderProducts
);



document
.getElementById(
    "sortFilter"
)
.addEventListener(
    "change",
    renderProducts
);



/* HEADER SEARCH */

document
.getElementById(
    "headerSearch"
)
.addEventListener(
    "input",
    function(){


        document
        .getElementById(
            "catalogSearch"
        )
        .value =
            this.value;


        renderProducts();

    }
);



/* =========================================================
   CLOSE MODAL WHEN CLICKING BACKGROUND
========================================================= */

document
.getElementById(
    "productModal"
)
.addEventListener(
    "click",
    function(event){


        if(
            event.target
            ===
            this
        ){

            closeProduct();

        }

    }
);



/* ESC */

document
.addEventListener(
    "keydown",
    function(event){


        if(
            event.key
            ===
            "Escape"
        ){

            closeProduct();

        }

    }
);



/* INITIAL */

renderProducts();
